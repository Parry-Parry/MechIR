[pytest]
# Registering the marker silences PytestUnknownMarkWarning and makes
# `-m "not integration"` a usable filter -- which is what `make test`, the
# Docker image's default command and the per-push CI job all select on.
#
# test/integration/conftest.py applies this marker to everything in that
# directory automatically, so a new file there joins the nightly suite
# rather than the fast one by default.
markers =
    integration: end-to-end tests that load real models and may hit the network

# There is no `__init__.py` under test/, so pytest's default "prepend"
# import mode identifies a test module by basename alone -- two files
# named the same (e.g. test/unit/test_rollout.py and
# test/acceptance/test_rollout.py, one random-weights, one a real
# checkpoint) collide with "import file mismatch". importlib mode keys
# modules by their full path instead, so same-named test files in
# different directories can coexist without adding package markers.
addopts = --import-mode=importlib
