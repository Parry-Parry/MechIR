[pytest]
# Registering the marker silences PytestUnknownMarkWarning and makes
# `-m "not integration"` a usable filter -- which is what `make test`, the
# Docker image's default command and the per-push CI job all select on.
#
# test/integration/conftest.py applies this marker to everything in that
# directory automatically, so a new file there joins the nightly suite
# rather than the fast one by default.
markers =
    integration: end-to-end tests that load real models and may hit the network
