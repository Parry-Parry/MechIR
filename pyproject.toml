[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechir"
version = "0.2.0"
dependencies = [
  # Upper bound is load-bearing: TransformerLens 4.0 removed
  # `loading_from_pretrained`, `pretrained.weight_conversions` and
  # `HookedEncoder`, all of which mechir imports. See docs/upgrading.md.
  "transformer_lens>=2.15,<3",
  "torch",
  # Upper bound is load-bearing, like the TransformerLens one above and for the
  # same reason: TransformerLens 2.x reaches into transformers internals that
  # 5.0 reorganised. Against transformers 5 every HookedTransformer test dies
  # with "'GPTNeoXConfig' object has no attribute 'rotary_pct'". Unpinned, this
  # resolves to 5.x locally while CI happens to get 4.57.6 -- the same
  # unpinned-dependency drift that kept `main` red for two days.
  "transformers>=4.40,<5",
  "ir_datasets",
  # TransformerLens 2.x caps numpy<2; pyarrow>=21 requires numpy>=2 at
  # runtime without declaring it, so both need bounding or `import mechir`
  # dies with "pyarrow requires NumPy 2.0 or newer".
  "numpy>=1.26,<2",
  "datasets<4",
  "pyarrow<21",
  # Imported unconditionally but previously undeclared.
  "jaxtyping",
  "pandas",
]
requires-python = ">=3.10"
authors = [
  {name = "Andrew Parry", email = "0andrewparry@gmail.com"},
  {name = "Catherine Chen", email = "catherine_s_chen@brown.edu"}
]
maintainers = [
  {name = "Andrew Parry", email = "0andrewparry@gmail.com"}
]
description = "A package for mechanistic interpretability in Neural IR"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pytorch", "transformers", "ranking", "information retrieval"]
classifiers = [
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# mechir.pipeline -- ranker-and-reader interpretability. Research code, not
# settled library surface. The HotpotQA loader reads answers from the
# HuggingFace `datasets` distractor config, because beir/hotpotqa exposes no
# answer field; core already constrains `datasets` for an unrelated numpy
# reason, so this names the dependency the feature actually needs rather
# than relying on that.
rag = [
  "datasets<4",
  "ir_datasets",
]
# Plotting was core until 0.2.0, which meant `pip install mechir` pulled
# seaborn, matplotlib, plotly and streamlit -- a web framework -- for four
# helper functions.
plotting = [
  "seaborn",
  "matplotlib",
  "plotly",
  "streamlit",
]
# Only for the runnable scripts under examples/ and scripts/ -- the library
# itself imports none of these. `fire` gives them a CLI, pyterrier and
# pyterrier_dr provide the first-stage retrieval and scorers they compare
# against. scripts/generate_data.py additionally needs the axiomatic extra.
examples = [
  "fire",
  "tqdm",
  "python-terrier",
  "pyterrier-dr",
]
# Guarded behind util.is_pyterrier_availible / is_ir_axioms_availible, so
# only needed for the index-backed axiomatic perturbations.
axiomatic = [
  "python-terrier",
  "ir_axioms",
]
dev = [
  "pytest",
  "flake8",
  # Pinned: black's formatting rules change between releases, so an
  # unpinned version means CI can reject code that is correctly formatted
  # locally. 26.10.1 rejected what 24.10.0 accepted and failed a release.
  "black==26.10.1",
]

[project.urls]
Repository = "https://github.com/Parry-Parry/MechIR.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechir = ["perturb/data/stopwords.txt"]
