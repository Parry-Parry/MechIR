# Builds, tests and publishes to PyPI when a release is published.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A PyPI version number cannot be reused, so a bad publish is permanent.
  # Verify the package imports and its tests pass before the upload step.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Lint (errors)
      run: |
        flake8 src test --count --show-source --statistics \
          --select=E9,F63,F701,F702,F811,F821,F82
    - name: Check formatting
      run: black --check --diff src test
    - name: Test
      run: pytest test/unit test/acceptance -v

  # Guards against tagging a release whose version does not match the one
  # that would be uploaded -- the kind of mismatch only noticed after the
  # upload cannot be undone.
  check-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Tag must match the packaged version
      run: |
        packaged=$(python -c "import tomllib,pathlib; \
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
        tag="${GITHUB_REF_NAME#v}"
        echo "packaged=$packaged tag=$tag"
        if [ "$packaged" != "$tag" ]; then
          echo "::error::release tag $GITHUB_REF_NAME does not match pyproject version $packaged"
          exit 1
        fi

  deploy:
    needs: [test, check-version]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
