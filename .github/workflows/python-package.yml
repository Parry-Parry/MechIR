# Installs the package, lints it, and runs the test suite.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    # Install the package itself, so the pins in pyproject.toml -- the single
    # source of truth for dependencies -- are what actually gets exercised.
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        # Install the extras too: the plotting and pipeline tests are
        # skipped without them, which would hide regressions.
        python -m pip install -e ".[dev,plotting,rag]"
        # Pinned on purpose. An unpinned formatter is how `main` stayed red
        # for two days: black 26.10.1 rejected code that 24.10.0 accepted,
        # so CI failed on files that were correctly formatted locally. Bump
        # this deliberately, with the reformat in the same commit.
        python -m pip install "ruff==0.11.7"

    - name: Show resolved dependency versions
      run: python -m pip list

    # Hard gate. Syntax errors and undefined names fail the build.
    # F701/F702 rather than the F7 prefix, which would also match F722,
    # "syntax error in forward annotation" -- a false positive on every one
    # of the ~130 jaxtyping shapes in the codebase, because
    # `Float[torch.Tensor, "batch pos"]` is not parseable as an annotation.
    - name: Lint (errors)
      run: |
        ruff check src test --no-cache --statistics \
          --select=E9,F63,F701,F702,F811,F821,F82

    # Advisory. Style findings are reported but do not fail the build.
    - name: Lint (style, advisory)
      run: ruff check src test --no-cache --exit-zero --statistics

    - name: Check formatting
      run: ruff format --check --diff src test

    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ runner.os }}-bert-base-uncased

    # The fast suite: unit and acceptance. Selected by marker rather than by
    # directory so this and `make test` cannot drift apart, and so a new
    # directory is covered by default. test/integration downloads ~1.4GB of
    # checkpoints and runs nightly in integration.yml instead.
    - name: Test
      run: pytest -m "not integration" -v
