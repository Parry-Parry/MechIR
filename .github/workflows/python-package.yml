# Installs the package, lints it, and runs the test suite.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    # Install the package itself rather than requirements.txt, so the pins in
    # pyproject.toml are what actually gets exercised.
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Show resolved dependency versions
      run: python -m pip list

    # Hard gate. Syntax errors and undefined names fail the build.
    # F701/F702 rather than the F7 prefix, which would also match the F722
    # jaxtyping false positives -- see .flake8.
    - name: Lint (errors)
      run: |
        flake8 src test --count --show-source --statistics \
          --select=E9,F63,F701,F702,F811,F821,F82

    # Advisory. Style findings are reported but do not fail the build.
    - name: Lint (style, advisory)
      run: flake8 src test --count --exit-zero --statistics

    - name: Check formatting
      run: black --check --diff src test

    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ runner.os }}-bert-base-uncased

    - name: Test
      run: pytest test/unit test/acceptance -v
